<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6faff" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('dmb-timer-theme')
          var prefersDark =
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : prefersDark
                ? 'dark'
                : 'light'

          document.documentElement.dataset.theme = theme
          document.documentElement.style.colorScheme = theme

          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) {
            meta.setAttribute('content', theme === 'dark' ? '#0b1322' : '#f6faff')
          }
        } catch (error) {
          // Ignore storage access errors; the app still applies a theme after mount.
        }
      })()
    </script>
    <meta
      name="description"
      content="Ватрушный ДМБ Таймер — личный отсчёт дней, часов, минут и секунд до демобилизации друзей."
    />
    <title>Ватрушный ДМБ Таймер — отсчёт до демобилизации</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
